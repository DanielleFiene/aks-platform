apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  namespace: apps
spec:
  selector:
    app: nginx-test
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
