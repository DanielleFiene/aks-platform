apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime-checker
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - uptime.20.76.131.40.nip.io
      secretName: uptime-tls
  rules:
    - host: uptime.20.76.131.40.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: uptime-checker
                port:
                  number: 80
